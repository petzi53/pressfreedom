name: Deploy to shinyapps.io

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy Shiny app
    runs-on: ubuntu-latest
    env:
      # Authenticates GitHub API calls made by pak when resolving GitHub-only
      # remotes (flagon, ggbump, pressfreedom.data). Without this,
      # unauthenticated API requests are capped at 60/hour, easily exhausted
      # on shared runners.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          # Cache key is scoped to this workflow file: any change to the
          # explicit package list below invalidates the cache automatically.
          key: deploy-shinyapps-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy-shinyapps.yml') }}

      - name: Install app runtime dependencies
        shell: Rscript {0}
        run: |
          install.packages("pak")

          # Deliberately NOT using renv::restore() here: the project's
          # renv.lock is a full snapshot of Peter's local dev library
          # (type = "all"), which includes devtools/testthat/pkgdown and
          # their transitive Suggests (e.g. magick, which needs system
          # ImageMagick libs this runner doesn't have). None of that is
          # needed to run the app. Instead, install exactly the runtime
          # packages the app uses, matching the "Dependencies" table in
          # AGENTS.md (Imports + the Suggests actually loaded by inst/app/).
          pak::pkg_install(c(
            # Imports
            "shiny",
            "petzi53/pressfreedom.data",
            # Suggests actually used at runtime by inst/app/
            "bslib",
            "dplyr",
            "ggplot2",
            "davidsjoberg/ggbump",
            "plotly",
            "RColorBrewer",
            "coolbutuseless/flagon",
            "countrycode",
            "htmlwidgets",
            # Deployment tool itself
            "rsconnect"
          ))

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APPID: ${{ secrets.SHINYAPPS_APPID }}
        run: |
          # Set up rsconnect credentials
          rsconnect::setAccountInfo(
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          # Deploy the app from inst/app
          rsconnect::deployApp(
            appDir = "inst/app",
            appName = "pressfreedom",
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            appId = as.numeric(Sys.getenv("SHINYAPPS_APPID")),
            forceUpdate = TRUE
          )

          cat("✓ Deployment to shinyapps.io successful\n")
