name: Deploy to shinyapps.io

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy Shiny app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Restore renv cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-

      - name: Install renv and restore dependencies
        shell: Rscript {0}
        run: |
          install.packages("renv")
          renv::restore()

      - name: Install rsconnect
        shell: Rscript {0}
        run: |
          install.packages("rsconnect")

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APPID: ${{ secrets.SHINYAPPS_APPID }}
        run: |
          # Set up rsconnect credentials
          rsconnect::setAccountInfo(
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          # Deploy the app from inst/app
          rsconnect::deployApp(
            appDir = "inst/app",
            appName = "pressfreedom",
            account = Sys.getenv("SHINYAPPS_ACCOUNT"),
            appId = as.numeric(Sys.getenv("SHINYAPPS_APPID")),
            forceUpdate = TRUE
          )

          cat("✓ Deployment to shinyapps.io successful\n")
